[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pirelywebamilen"
version = "0.1.0"
description = "Strict-by-default web shield with a closed detection core (open shell only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "aniso199191" }]
keywords = ["security", "waf", "rate-limit", "bot-detection"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["pirelywebamilen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
